services:
  - type: web
    name: radix-healthcare-ai
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: STORAGE_BACKEND
        value: local
      - key: ENABLE_FIREBASE_SYNC
        value: "true"
      - key: AI_PROVIDER
        value: densenet121
