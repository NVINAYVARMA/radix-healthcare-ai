<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes aiHover {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    @keyframes aiRadarPulse {
      0% { r: 88px; opacity: 0.8; stroke-width: 2px; }
      100% { r: 97px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes visorBeam {
      0%, 100% { transform: translateX(-20px); opacity: 0.3; }
      50% { transform: translateX(20px); opacity: 1; }
    }
    @keyframes scanWave {
      0% { transform: translateY(60px); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: translateY(140px); opacity: 0; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; filter: drop-shadow(0 0 3px #38bdf8); }
    }
    .ai-group { animation: aiHover 3s ease-in-out infinite; transform-origin: 100px 100px; }
    .ai-pulse-wave { animation: aiRadarPulse 2.4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite; }
    .visor-shine { animation: visorBeam 2.5s ease-in-out infinite; }
    .scan-line { animation: scanWave 2s linear infinite; }
    .node-dot { animation: nodeBlink 1.8s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGradAi)" />
  <circle class="ai-pulse-wave" cx="100" cy="100" r="90" fill="none" stroke="#38bdf8" />

  <!-- Animated Diagnostic Grid Back -->
  <line x1="40" y1="100" x2="160" y2="100" stroke="#0284c7" stroke-width="0.5" opacity="0.3" />
  <line x1="100" y1="40" x2="100" y2="160" stroke="#0284c7" stroke-width="0.5" opacity="0.3" />
  <circle cx="100" cy="100" r="60" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.4" />

  <!-- Laser Scan Wave -->
  <line class="scan-line" x1="45" y1="0" x2="155" y2="0" stroke="#38bdf8" stroke-width="1.8" filter="drop-shadow(0 0 4px #38bdf8)" />

  <!-- AI Medic Character -->
  <g class="ai-group">
    <!-- Body / High-Tech Scrub Chassis -->
    <path d="M 64 136 L 136 136 L 148 185 L 52 185 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <path d="M 76 136 L 100 156 L 124 136 Z" fill="#0284c7" opacity="0.3" />

    <!-- RADIX Delta A Holographic Symbol on Chest -->
    <polygon points="100,146 90,165 94,165 100,152 106,165 110,165" fill="#38bdf8" />
    <line x1="93" y1="160" x2="107" y2="160" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Neck Chassis -->
    <rect x="88" y="108" width="24" height="28" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" />
    <line x1="92" y1="118" x2="108" y2="118" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />
    <line x1="92" y1="124" x2="108" y2="124" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />

    <!-- Head / Cranial Visor Unit -->
    <ellipse cx="100" cy="82" rx="30" ry="32" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4" />
    <path d="M 74 68 Q 100 56 126 68 Q 132 82 126 96 Q 100 84 74 96 Z" fill="#1e293b" />

    <!-- Visor Diagnostic Display Screen -->
    <rect x="74" y="74" width="52" height="18" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="76" y="76" width="48" height="14" rx="6" fill="url(#visorGrad)" opacity="0.85" />

    <!-- Visor Scanning Glint -->
    <g class="visor-shine">
      <line x1="94" y1="76" x2="106" y2="90" stroke="#ffffff" stroke-width="2.5" opacity="0.8" stroke-linecap="round" />
    </g>

    <!-- Ear Sensors / Nodes -->
    <circle class="node-dot" cx="69" cy="82" r="3" fill="#38bdf8" />
    <circle class="node-dot" cx="131" cy="82" r="3" fill="#38bdf8" />
  </g>

  <!-- Border Ring -->
  <circle cx="100" cy="100" r="97.5" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.9" />
</svg>
