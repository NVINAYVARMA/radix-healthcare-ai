<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="coatGradM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes breatheM {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2.5px); }
    }
    @keyframes pulseRingM {
      0%, 100% { transform: scale(0.96); opacity: 0.3; }
      50% { transform: scale(1.03); opacity: 0.8; }
    }
    @keyframes blinkM {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    @keyframes glassesShine {
      0%, 100% { opacity: 0.2; transform: translateX(-15px); }
      50% { opacity: 0.75; transform: translateX(15px); }
    }
    .char-group-m { animation: breatheM 3.8s ease-in-out infinite; transform-origin: 100px 150px; }
    .pulse-ring-m { animation: pulseRingM 3.2s ease-in-out infinite; transform-origin: 100px 100px; }
    .eye-m { animation: blinkM 4.5s infinite; transform-origin: 100px 88px; }
    .shine-m { animation: glassesShine 4s ease-in-out infinite; }
  </style>

  <!-- Circular Base Background -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad2)" />
  <circle class="pulse-ring-m" cx="100" cy="100" r="94" fill="none" stroke="#38bdf8" stroke-dasharray="5 3" opacity="0.5" stroke-width="1.8" />

  <!-- Character -->
  <g class="char-group-m">
    <!-- Neck -->
    <path d="M 88 100 L 112 100 L 114 122 L 86 122 Z" fill="#fed7aa" />

    <!-- Head / Face -->
    <ellipse cx="100" cy="85" rx="28" ry="32" fill="#ffedd5" />

    <!-- Hair (Neat Modern Style) -->
    <path d="M 72 80 Q 70 54 90 48 Q 115 45 128 58 Q 132 72 128 80 Q 124 62 108 58 Q 90 58 76 72 Z" fill="#1e293b" />
    <path d="M 72 80 Q 74 65 84 62 Q 95 60 115 62 Q 128 66 128 80 Z" fill="#334155" />

    <!-- Eyebrows -->
    <path d="M 80 77 Q 87 74 94 77" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 106 77 Q 113 74 120 77" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" />

    <!-- Eyes (Animated) -->
    <g class="eye-m">
      <ellipse cx="87" cy="86" rx="3.5" ry="4.2" fill="#0f172a" />
      <ellipse cx="113" cy="86" rx="3.5" ry="4.2" fill="#0f172a" />
      <circle cx="88.5" cy="84" r="1.4" fill="#ffffff" />
      <circle cx="114.5" cy="84" r="1.4" fill="#ffffff" />
    </g>

    <!-- Professional Glasses -->
    <rect x="76" y="80" width="22" height="15" rx="4" fill="none" stroke="#0284c7" stroke-width="1.8" />
    <rect x="102" y="80" width="22" height="15" rx="4" fill="none" stroke="#0284c7" stroke-width="1.8" />
    <line x1="98" y1="87" x2="102" y2="87" stroke="#0284c7" stroke-width="1.8" />
    <line x1="72" y1="86" x2="76" y2="86" stroke="#0284c7" stroke-width="1.5" />
    <line x1="124" y1="86" x2="128" y2="86" stroke="#0284c7" stroke-width="1.5" />
    <!-- Glasses Lens Glint -->
    <g class="shine-m">
      <line x1="82" y1="82" x2="90" y2="92" stroke="#ffffff" stroke-width="1.4" opacity="0.6" stroke-linecap="round" />
      <line x1="108" y1="82" x2="116" y2="92" stroke="#ffffff" stroke-width="1.4" opacity="0.6" stroke-linecap="round" />
    </g>

    <!-- Nose -->
    <path d="M 100 88 L 98 94 L 102 94" fill="none" stroke="#fba75d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Confident Smile -->
    <path d="M 93 100 Q 100 105 107 100" fill="none" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" />

    <!-- Tie & Collar -->
    <polygon points="100,122 93,115 100,110 107,115" fill="#0284c7" />
    <path d="M 98 122 L 96 160 L 100 166 L 104 160 L 102 122 Z" fill="#0284c7" />
    <path d="M 88 116 L 94 126 L 100 114 L 88 116 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <path d="M 112 116 L 106 126 L 100 114 L 112 116 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />

    <!-- Blue Shirt Background -->
    <path d="M 80 122 L 120 122 L 125 185 L 75 185 Z" fill="#0369a1" />

    <!-- Stethoscope -->
    <path d="M 82 124 C 74 140 76 156 86 162 C 92 166 95 162 95 155" fill="none" stroke="#475569" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 118 124 C 126 140 124 156 114 162 C 108 166 105 162 105 155" fill="none" stroke="#475569" stroke-width="3.2" stroke-linecap="round" />
    <!-- Bell -->
    <circle cx="95" cy="155" r="5.5" fill="#94a3b8" stroke="#0f172a" stroke-width="1" />
    <circle cx="95" cy="155" r="2.8" fill="#38bdf8" />

    <!-- White Lab Coat Over Shoulders -->
    <path d="M 50 144 Q 72 122 86 122 L 94 174 L 70 185 L 42 178 Z" fill="url(#coatGradM)" stroke="#cbd5e1" stroke-width="0.75" />
    <path d="M 150 144 Q 128 122 114 122 L 106 174 L 130 185 L 158 178 Z" fill="url(#coatGradM)" stroke="#cbd5e1" stroke-width="0.75" />

    <!-- Lapels -->
    <path d="M 86 122 L 72 152 L 90 154 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.7" />
    <path d="M 114 122 L 128 152 L 110 154 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.7" />
  </g>

  <!-- Border Ring -->
  <circle cx="100" cy="100" r="97.5" fill="none" stroke="#0284c7" stroke-width="1.8" opacity="0.8" />
</svg>
