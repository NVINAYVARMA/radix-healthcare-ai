<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="60%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="scrubIndigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes breatheF3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2.6px); }
    }
    @keyframes pulseRingF3 {
      0%, 100% { transform: scale(0.96); opacity: 0.3; }
      50% { transform: scale(1.03); opacity: 0.8; }
    }
    @keyframes blinkF3 {
      0%, 93%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.1); }
    }
    @keyframes badgeBeat {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 1px #a5b4fc); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 6px #818cf8); }
    }
    .char-group-f3 { animation: breatheF3 3.7s ease-in-out infinite; transform-origin: 100px 150px; }
    .pulse-ring-f3 { animation: pulseRingF3 3.3s ease-in-out infinite; transform-origin: 100px 100px; }
    .eye-f3 { animation: blinkF3 4.8s infinite; transform-origin: 100px 88px; }
    .heart-badge { animation: badgeBeat 2s ease-in-out infinite; transform-origin: 130px 148px; }
  </style>

  <!-- Circular Base Background -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad5)" />
  <circle class="pulse-ring-f3" cx="100" cy="100" r="93" fill="none" stroke="#a5b4fc" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.6" />

  <!-- Character -->
  <g class="char-group-f3">
    <!-- Hair Back / High Bun -->
    <circle cx="100" cy="52" r="22" fill="#1e1b4b" />

    <!-- Neck -->
    <path d="M 90 102 L 110 102 L 112 122 L 88 122 Z" fill="#e2b189" />

    <!-- Head / Face -->
    <ellipse cx="100" cy="86" rx="27" ry="31" fill="#f5c79e" />

    <!-- Hair Front -->
    <path d="M 72 78 Q 78 52 100 52 Q 122 52 128 78 Q 115 62 100 62 Q 85 62 72 78 Z" fill="#1e1b4b" />
    <path d="M 72 78 Q 76 96 74 102 Q 72 90 73 80 Z" fill="#1e1b4b" />
    <path d="M 128 78 Q 124 96 126 102 Q 128 90 127 80 Z" fill="#1e1b4b" />

    <!-- Pearl Earrings -->
    <circle cx="72" cy="92" r="2.2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5" />
    <circle cx="128" cy="92" r="2.2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5" />

    <!-- Eyebrows -->
    <path d="M 82 77 Q 88 74 94 76" fill="none" stroke="#1e1b4b" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 106 76 Q 112 74 118 77" fill="none" stroke="#1e1b4b" stroke-width="1.8" stroke-linecap="round" />

    <!-- Eyes (Animated) -->
    <g class="eye-f3">
      <ellipse cx="88" cy="86" rx="3.3" ry="4" fill="#0f172a" />
      <ellipse cx="112" cy="86" rx="3.3" ry="4" fill="#0f172a" />
      <circle cx="89.5" cy="84.5" r="1.3" fill="#ffffff" />
      <circle cx="113.5" cy="84.5" r="1.3" fill="#ffffff" />
      <!-- Lash -->
      <path d="M 83 83 Q 88 81 93 83" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />
      <path d="M 107 83 Q 112 81 117 83" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Cheeks Blush -->
    <ellipse cx="83" cy="94" rx="4" ry="2.2" fill="#f43f5e" opacity="0.25" />
    <ellipse cx="117" cy="94" rx="4" ry="2.2" fill="#f43f5e" opacity="0.25" />

    <!-- Nose -->
    <path d="M 99 90 Q 100 94 102 94" fill="none" stroke="#d97706" stroke-width="1.4" stroke-linecap="round" />

    <!-- Pleasant Smile -->
    <path d="M 94 100 Q 100 105 106 100" fill="none" stroke="#be123c" stroke-width="1.8" stroke-linecap="round" />

    <!-- Medical Scrubs -->
    <path d="M 76 122 L 124 122 L 132 185 L 68 185 Z" fill="url(#scrubIndigo)" />
    <!-- V-Neck -->
    <path d="M 92 122 L 100 134 L 108 122 Z" fill="#f5c79e" />
    <path d="M 90 122 L 100 136 L 110 122" fill="none" stroke="#3730a3" stroke-width="2" />

    <!-- Stethoscope -->
    <path d="M 84 122 C 75 140 76 156 86 162 C 92 165 96 162 96 156" fill="none" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round" />
    <path d="M 116 122 C 125 140 124 156 114 162 C 108 165 104 162 104 156" fill="none" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round" />
    <circle cx="100" cy="162" r="6" fill="#ffffff" stroke="#3730a3" stroke-width="1" />
    <circle cx="100" cy="162" r="3" fill="#6366f1" />

    <!-- Pulsing Heart / Cross Badge -->
    <g class="heart-badge">
      <circle cx="130" cy="148" r="8" fill="#ffffff" stroke="#4338ca" stroke-width="0.8" />
      <path d="M 130 144 L 130 152 M 126 148 L 134 148" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Border Ring -->
  <circle cx="100" cy="100" r="97.5" fill="none" stroke="#818cf8" stroke-width="1.6" opacity="0.8" />
</svg>
