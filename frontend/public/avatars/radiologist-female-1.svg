<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="scrubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes breathe {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2.5px); }
    }
    @keyframes pulseRing {
      0%, 100% { r: 92px; opacity: 0.3; stroke-width: 1.5; }
      50% { r: 95px; opacity: 0.8; stroke-width: 2.5; }
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes ecgPulse {
      0% { stroke-dashoffset: 60; opacity: 0.4; }
      50% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -60; opacity: 0.4; }
    }
    @keyframes badgeGlow {
      0%, 100% { filter: drop-shadow(0 0 2px #38bdf8); }
      50% { filter: drop-shadow(0 0 6px #38bdf8); }
    }
    .char-group { animation: breathe 3.6s ease-in-out infinite; transform-origin: 100px 150px; }
    .pulse-circle { animation: pulseRing 3s ease-in-out infinite; transform-origin: 100px 100px; }
    .eye { animation: blink 4.2s infinite; transform-origin: 100px 88px; }
    .ecg-line {
      stroke-dasharray: 60;
      animation: ecgPulse 2.8s linear infinite;
    }
    .badge-icon { animation: badgeGlow 2.5s ease-in-out infinite; }
  </style>

  <!-- Circular Base Background -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad1)" />
  <circle class="pulse-circle" cx="100" cy="100" r="93" fill="none" stroke="#38bdf8" stroke-dasharray="6 4" opacity="0.4" />

  <!-- Animated ECG Line in Background -->
  <path class="ecg-line" d="M 20 145 L 60 145 L 70 135 L 80 155 L 90 140 L 100 148 L 110 145 L 180 145" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Radiologist Character -->
  <g class="char-group">
    <!-- Hair Back -->
    <path d="M 68 85 Q 60 120 72 138 Q 100 144 128 138 Q 140 120 132 85 Z" fill="#332219" />

    <!-- Neck -->
    <path d="M 90 102 L 110 102 L 112 120 L 88 120 Z" fill="#fbcfe8" />

    <!-- Head / Face -->
    <ellipse cx="100" cy="85" rx="27" ry="32" fill="#fce7f3" />

    <!-- Hair Front / Style -->
    <path d="M 72 78 Q 80 50 100 50 Q 120 50 128 78 Q 134 62 122 55 Q 100 48 78 55 Q 66 62 72 78 Z" fill="#451a03" />
    <path d="M 73 75 Q 85 82 100 75 Q 115 82 127 75 Q 129 90 128 105 Q 125 106 122 96 Q 124 82 118 78 Q 100 78 82 78 Q 76 82 78 96 Q 75 106 72 105 Z" fill="#451a03" />

    <!-- Cheeks Blush -->
    <ellipse cx="84" cy="94" rx="4.5" ry="2.5" fill="#f472b6" opacity="0.35" />
    <ellipse cx="116" cy="94" rx="4.5" ry="2.5" fill="#f472b6" opacity="0.35" />

    <!-- Eyes (Animated Blinking) -->
    <g class="eye">
      <ellipse cx="88" cy="86" rx="3.2" ry="4" fill="#0f172a" />
      <ellipse cx="112" cy="86" rx="3.2" ry="4" fill="#0f172a" />
      <circle cx="89" cy="84.5" r="1.2" fill="#ffffff" />
      <circle cx="113" cy="84.5" r="1.2" fill="#ffffff" />
      <!-- Eyelashes -->
      <path d="M 83 82 Q 88 80 93 82" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />
      <path d="M 107 82 Q 112 80 117 82" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Eyebrows -->
    <path d="M 83 77 Q 88 74 93 76" fill="none" stroke="#78350f" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 107 76 Q 112 74 117 77" fill="none" stroke="#78350f" stroke-width="1.6" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M 99 89 Q 100 93 102 93" fill="none" stroke="#f472b6" stroke-width="1.3" stroke-linecap="round" />

    <!-- Gentle Smile -->
    <path d="M 94 99 Q 100 104 106 99" fill="none" stroke="#be185d" stroke-width="1.8" stroke-linecap="round" />

    <!-- Scrubs Inner Top -->
    <path d="M 82 118 L 118 118 L 126 185 L 74 185 Z" fill="url(#scrubGrad)" />
    <!-- Scrubs V-Neck -->
    <path d="M 92 118 L 100 130 L 108 118 Z" fill="#fce7f3" />
    <path d="M 91 118 L 100 131 L 109 118" fill="none" stroke="#0284c7" stroke-width="1.5" />

    <!-- Stethoscope Tube Around Neck -->
    <path d="M 84 120 C 76 136 78 152 86 160 C 92 165 96 162 96 156" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path d="M 116 120 C 124 136 122 152 114 160 C 108 165 104 162 104 156" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <!-- Stethoscope Chest Bell (Metal) -->
    <circle cx="100" cy="162" r="6.5" fill="#94a3b8" stroke="#0f172a" stroke-width="1" />
    <circle cx="100" cy="162" r="3.5" fill="#38bdf8" />

    <!-- White Lab Coat Over Shoulders -->
    <path d="M 52 142 Q 74 120 88 120 L 96 172 L 72 185 L 45 178 Z" fill="url(#coatGrad)" stroke="#cbd5e1" stroke-width="0.75" />
    <path d="M 148 142 Q 126 120 112 120 L 104 172 L 128 185 L 155 178 Z" fill="url(#coatGrad)" stroke="#cbd5e1" stroke-width="0.75" />

    <!-- Coat Lapels -->
    <path d="M 88 120 L 76 148 L 92 150 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.7" />
    <path d="M 112 120 L 124 148 L 108 150 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.7" />

    <!-- Radiologist Identity Badge (Right Chest) with Animated Glow -->
    <g class="badge-icon">
      <rect x="122" y="140" width="16" height="22" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="0.8" />
      <rect x="124" y="142" width="12" height="6" fill="#0284c7" rx="1" />
      <line x1="124" y1="151" x2="136" y2="151" stroke="#64748b" stroke-width="0.8" />
      <line x1="124" y1="154" x2="134" y2="154" stroke="#94a3b8" stroke-width="0.8" />
      <circle cx="130" cy="158" r="1.5" fill="#10b981" />
    </g>
  </g>

  <!-- Border Ring -->
  <circle cx="100" cy="100" r="97.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
</svg>
