<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Deep Clinical Navy Rounded Background -->
  <rect width="64" height="64" rx="14" fill="#070d18"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="#0088cc" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Subtle Glow Effect -->
  <defs>
    <filter id="radixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="deltaGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>
    <linearGradient id="accentPulse" x1="24" y1="36" x2="40" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Faint Background Grid Crosshairs -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Iconic RADIX Delta Triangle -->
  <path
    d="M15 48L32 14L49 48"
    stroke="url(#deltaGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#radixGlow)"
  />

  <!-- High-Precision Clinical Crossbar / Medical Center Beam -->
  <circle cx="32" cy="14" r="2.8" fill="#38bdf8"/>
  <circle cx="15" cy="48" r="2.8" fill="#0284c7"/>
  <circle cx="49" cy="48" r="2.8" fill="#0066cc"/>

  <!-- Central Diagnostic Target Pulse -->
  <circle cx="32" cy="34" r="3.2" fill="#00e5ff" opacity="0.95"/>
  <circle cx="32" cy="34" r="6" stroke="#38bdf8" stroke-width="1" opacity="0.4" stroke-dasharray="2 2"/>
</svg>